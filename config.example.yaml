# Дефолтная конфигурация Гоги. Скопируйте в config.yaml и правьте под себя —
# config.yaml в .gitignore и не попадёт в репозиторий.

llm:
  model: gpt-oss:20b
  max_tool_iterations: 4
  # Только для выпадающего списка в GUI (Settings) — переключение принимает
  # любой тег модели, установленной в Ollama, этот список не ограничивает.
  available_models:
    - gpt-oss:20b
  system_prompt: >
    Ты — голосовой ассистент по имени Гоги. Отвечай на русском языке, кратко
    и естественно, как в живом разговоре — без списков и markdown-разметки,
    это будет озвучено вслух. Если пользователь просит открыть приложение
    или файл, используй инструменты open_app / open_file.

stt:
  # Замер (gogi-bench, AMD/CPU int8): small — 1.1% CER, ~1.8с на клип 9.6с;
  # base — 3.2% CER, ~0.5с; medium — 0% CER, ~5.8с. small берём дефолтом как
  # компромисс точность/скорость; base — если нужна максимальная отзывчивость
  # и команды простые, medium — если распознавание важнее задержки.
  model_size: small

tts:
  nfe_step: 32
  cfg_strength: 3.0
  default_voice: gogi
  voices:
    gogi:
      name: "Gogi Kavkaz"
      ref_audio: voices/gogi_voice.wav
      ref_text: voices/gogi_transcript.txt

# Whitelist-корень для файловых инструментов (list_dir/read_file/open_file) —
# путь относительно корня проекта. Выход за пределы этой директории запрещён.
files:
  root_dir: "."
  max_read_bytes: 65536
  # Скрыть из файлового браузера (не влияет на доступ через open_file/
  # read_file напрямую по пути — только на список в list_dir).
  hide:
    - .git
    - .github
    - __pycache__
    - venv
    - .pytest_cache
    - .ruff_cache
    - gogi.egg-info

# Значения путей поддерживают переменные окружения Windows (%APPDATA% и т.п.),
# они разворачиваются автоматически при загрузке конфига.
apps:
  chrome: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  browser: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  notepad: "notepad.exe"
  calculator: "calc.exe"
  explorer: "explorer.exe"
  cmd: "cmd.exe"
  powershell: "powershell.exe"
  vscode: "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\Code.exe"
  telegram: "%APPDATA%\\Telegram Desktop\\Telegram.exe"
  task_manager: "taskmgr.exe"
  settings: "ms-settings:"

# Русские алиасы -> канонический ключ в apps.
aliases:
  хром: chrome
  браузер: browser
  блокнот: notepad
  калькулятор: calculator
  проводник: explorer
  командная строка: cmd
  терминал: powershell
  телеграм: telegram
  телеграмм: telegram
  диспетчер задач: task_manager
  настройки: settings
