[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gogi"
version = "0.1.0"
description = "Локальный голосовой ассистент: STT (faster-whisper) -> LLM (Ollama) -> TTS (F5-TTS-Russian)"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "soundfile",
    "ollama",
    "pyyaml",
    "textual",
    "pywebview",
    "torchvision",
    "f5-tts",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "setuptools<81",
]
# torch/torchaudio НЕ входят сюда намеренно — их нужно ставить отдельно под
# конкретную видеокарту (NVIDIA CUDA или AMD ROCm), см. README. `pip install
# -e .` не заменяет этот шаг.

[project.scripts]
gogi = "tui:main"
gogi-gui = "gui:main"
gogi-console = "main:main"
gogi-bench = "scripts.bench_pipeline:main"

[tool.setuptools]
py-modules = ["main", "tui", "gui", "assistant", "tools", "config", "gpu", "stt_engine", "tts_engine"]
packages = ["scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "BLE001",  # намеренно широкий except на границах I/O (Ollama/микрофон/модели) —
               # цель именно поймать любую ошибку и показать понятное сообщение
]

[tool.ruff.lint.per-file-ignores]
# torchaudio.load подменяется ДО импорта f5_tts.api — импорт после монки-патча
# структурно обязателен, это не забытый порядок импортов.
"tts_engine.py" = ["E402"]
"scripts/*.py" = ["E402"]
# sys.stdout.reconfigure() должен идти до import ollama, иначе консольный
# вывод на Windows ломается на кириллице.
"main.py" = ["E402"]
